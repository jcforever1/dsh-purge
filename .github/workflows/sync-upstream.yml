name: Sync upstream

# Pulls upstream YuJunZhiXue/dsh-purge into this mirror, re-applies the mirror's own changes,
# regenerates the market index, and commits the result. Nothing is pushed unless every step
# succeeds, so a failed run leaves the published mirror exactly as it was.
#
# The mirror's own changes live in two places:
#   - package.json: the `postinstall` entry is removed (a script, so it is re-applied by step).
#   - mirror/local-changes.patch: the mirror's source edits, as a patch against upstream's code.
#     It is re-applied after the tree copy and regenerated from the result, so it stays
#     correct as upstream moves.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/YuJunZhiXue/dsh-purge.git 2>/dev/null || true
          git fetch --depth=1 upstream master
          echo "upstream HEAD: $(git rev-parse FETCH_HEAD)"

      - name: Copy the upstream tree
        run: |
          # Everything upstream ships, except the files this mirror owns.
          git checkout FETCH_HEAD -- . \
            ':(exclude)index.json' \
            ':(exclude)make-index.mjs' \
            ':(exclude)MIRROR.md' \
            ':(exclude)mirror-notice.md' \
            ':(exclude)README.md' \
            ':(exclude)README.zh-CN.md' \
            ':(exclude).github' \
            ':(exclude)mirror'

      - name: Re-apply the mirror's source changes
        run: |
          # The patch holds the mirror's own source edits, relative to upstream. When upstream
          # adopts those edits (they landed upstream as 671011a), the patch is obsolete and the
          # mirror carries no local code change at all — the file is then absent, and this step
          # is a no-op.
          if [ -s mirror/local-changes.patch ]; then
            git apply --3way --whitespace=nowarn mirror/local-changes.patch
            echo "mirror changes re-applied"
          else
            echo "no local changes to re-apply"
          fi

      - name: Re-apply the mirror's change to the manifest
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.scripts && pkg.scripts.postinstall) {
              delete pkg.scripts.postinstall;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('removed the postinstall entry');
            } else {
              console.log('no postinstall entry to remove');
            }
          "

      - name: Refresh the READMEs from upstream and restore the mirror notice
        run: |
          git checkout FETCH_HEAD -- README.md README.zh-CN.md
          for f in README.md README.zh-CN.md; do
            cat mirror-notice.md "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Regenerate the mirror's own change patch
        run: |
          # Keep the patch only while the mirror really carries code that upstream does not.
          git diff FETCH_HEAD -- lib/ > mirror/local-changes.patch
          if [ -s mirror/local-changes.patch ]; then
            echo "mirror/local-changes.patch regenerated ($(grep -c '^diff --git' mirror/local-changes.patch) files)"
          else
            rm -f mirror/local-changes.patch
            echo "the mirror carries no code that upstream does not; the patch file is gone"
          fi

      - name: Install the validator DSH ships
        run: npm install --no-audit --no-fund --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.2 semver

      - name: Regenerate and validate the market index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node make-index.mjs --repo jcforever1/dsh-purge --ref master --out index.json

      - name: Commit the synced tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'already in sync with upstream'
          else
            git commit -m 'chore: sync upstream master'
            git push
          fi
